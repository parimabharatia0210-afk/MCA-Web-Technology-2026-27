<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>03 Advanced Registration Form Validation</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:20px;background:#f4f6fa;color:#222}input,textarea,select,button{padding:9px;margin:5px;max-width:100%}button{cursor:pointer}section,article{border:1px solid #ccc;padding:10px;margin:8px;background:white}pre{white-space:pre-wrap}</style></head><body><h2>Registration Form</h2><form id="f"><input id="name" placeholder="Full name" required><input id="email" placeholder="Email" required><input id="mobile" placeholder="10-digit mobile" required><input id="password" type="password" placeholder="Password" required><input id="confirm" type="password" placeholder="Confirm password" required><input id="course" placeholder="Course" required><button>Submit</button></form><div id="out"></div><script src="script.js"></script></body></html>
