<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>02 Dynamic Matrix Operations</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:20px;background:#f4f6fa;color:#222}input,textarea,select,button{padding:9px;margin:5px;max-width:100%}button{cursor:pointer}section,article{border:1px solid #ccc;padding:10px;margin:8px;background:white}pre{white-space:pre-wrap}</style></head><body><h2>Matrix Operations</h2><p>Enter matrices as comma-separated rows; use semicolons between rows.</p><input id="a" value="1,2;3,4"><input id="b" value="5,6;7,8"><select id="op"><option>add</option><option>subtract</option><option>multiply</option><option>transposeA</option><option>transposeB</option></select><button onclick="calc()">Calculate</button><pre id="out"></pre><script src="script.js"></script></body></html>
